name: Build & Release ScreenshotApp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      - name: Zip portable folder
        run: Compress-Archive -Path "SCREENSHOTAPP_PORTABLE\*" -DestinationPath "SCREENSHOTAPP_PORTABLE.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScreenshotApp ${{ github.ref_name }}
          files: SCREENSHOTAPP_PORTABLE.zip
          # Turning off prerelease so it shows up prominently on the sidebar
          prerelease: false
          make_latest: true
          # Explicitly providing the token to ensure it has permission
          token: ${{ secrets.GITHUB_TOKEN }}
