name: Build & Release ScreenshotApp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      - name: Zip portable folder
        run: Compress-Archive -Path "SCREENSHOTAPP_PORTABLE\*" -DestinationPath "SCREENSHOTAPP_PORTABLE.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCREENSHOTAPP_PORTABLE
          path: SCREENSHOTAPP_PORTABLE.zip
          retention-days: 1
          overwrite: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Note: Since this triggers on tags, we can use the tag name for the release
          # If triggered manually, it will still use 'latest' or a provided ref
          tag_name: ${{ github.ref_name }}
          name: ScreenshotApp ${{ github.ref_name }}
          files: SCREENSHOTAPP_PORTABLE.zip
          prerelease: true
          make_latest: true
