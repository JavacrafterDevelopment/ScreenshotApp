# Publishes a release whenever a version tag is pushed:
#
#   1. set the version in version.txt (e.g. 0.0.2) and commit
#   2. git tag v0.0.2 && git push origin main v0.0.2
#
# The release carries ScreenshotApp-windows-x64.zip: the portable PyInstaller
# folder plus a manifest of every file's SHA-256. The workflow also writes
# update.json to the `updates` branch, which is how the Javacrafter Launcher finds
# and verifies ScreenshotApp updates. The launcher shows them; it never installs
# one by itself.

name: Release

on:
  push:
    tags: ['v*']

# One release at a time, so two tags pushed together can't race on update.json.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches version.txt
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Get-Content version.txt -Raw).Trim()
          if ($tag -ne $ver) { throw "Tag v$tag doesn't match version.txt ($ver)" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      # The built app bundles Python and other people's packages (PyQt6 and
      # PyQt6-Fluent-Widgets are GPL-3.0), whose licenses have to travel with it.
      # pip-licenses collects each installed package's own license text.
      - name: Add license texts
        shell: pwsh
        run: |
          pip install pip-licenses
          $dir = 'SCREENSHOTAPP_PORTABLE/licenses'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item LICENSE-MIT, LICENSE-APACHE, licenses/* $dir
          $python = python -c "import sys; print(sys.base_prefix)"
          $pyLicense = Join-Path $python 'LICENSE.txt'
          if (Test-Path $pyLicense) { Copy-Item $pyLicense (Join-Path $dir 'Python-LICENSE.txt') }
          else { throw "Python's LICENSE.txt wasn't found under $python" }
          pip-licenses --from=mixed --with-urls --with-license-file --no-license-path --format=plain-vertical `
            --ignore-packages pip-licenses prettytable wcwidth |
            Out-File -Encoding utf8 (Join-Path $dir 'THIRD-PARTY-LICENSES.txt')
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Package
        shell: pwsh
        run: ./tools/release-package.ps1 -Folder SCREENSHOTAPP_PORTABLE -Name ScreenshotApp -Exe ScreenshotApp.exe -Version ${{ steps.version.outputs.version }} -Out release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          gh release create $tag release/ScreenshotApp-windows-x64.zip `
            --title "ScreenshotApp $($tag.TrimStart('v'))" --generate-notes $pre

      # update.json lives on its own `updates` branch so releases never add commits
      # to main. The launcher reads it from raw.githubusercontent.com.
      - name: Publish update.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $info = gh release view $tag --json body,isPrerelease | ConvertFrom-Json
          # Read raw: ConvertFrom-Json would turn the timestamp into a local-format date.
          $published = gh release view $tag --json publishedAt --jq .publishedAt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --heads origin updates) {
            git fetch --depth 1 origin updates
            git worktree add updates-branch FETCH_HEAD
          } else {
            # First release with update.json: start the branch with nothing else on it.
            git worktree add --detach updates-branch
            git -C updates-branch checkout --orphan updates
            git -C updates-branch rm -rf --quiet .
          }

          ./tools/publish-update.ps1 -Entry release/release-entry.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          git -C updates-branch add update.json
          git -C updates-branch commit -m "update.json for $tag"
          git -C updates-branch push origin HEAD:refs/heads/updates
